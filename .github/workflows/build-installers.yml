name: Compilar instaladores AURORA AutoFill
run-name: Instaladores - ${{ github.ref_name }} - ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [main, dev/correcao-expansao-windows]
    tags: ['v*']

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  windows:
    name: Windows - EXE (PyInstaller + Inno Setup)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Testes automatizados de regressão
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Compilar aplicativo Windows
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name "AURORA AutoFill" --icon "assets/aurora_icon.ico" --add-data "assets;assets" --add-data "app/accessibility_worker.ps1;app" --collect-submodules pynput main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verificar recursos compilados
        shell: pwsh
        run: |
          Set-Content -LiteralPath 'dist/AURORA AutoFill/SOURCE-COMMIT.txt' -Value '${{ github.sha }}' -Encoding utf8NoBOM
          python packaging/verify_bundle.py --platform windows --report windows-bundle-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar EXE e preservacao de dados em perfil temporario
        shell: pwsh
        run: |
          python packaging/smoke_frozen.py --exe 'dist/AURORA AutoFill/AURORA AutoFill.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python packaging/verify_bundle.py --platform windows --report windows-bundle-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preparar Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw 'Inno Setup não localizado' }
      - name: Criar instalador Windows
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "packaging/windows/AURORA-AutoFill.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Registrar origem e checksum Windows
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'dist/AURORA AutoFill/SOURCE-COMMIT.txt' -Destination 'SOURCE-COMMIT.txt'
          Get-FileHash -Algorithm SHA256 installer-win/*.exe | ForEach-Object {
            '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf)
          } | Set-Content -LiteralPath 'SHA256SUMS-Windows.txt' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: AURORA-AutoFill-Windows-${{ github.run_number }}
          path: |
            installer-win/*.exe
            windows-bundle-report.json
            SOURCE-COMMIT.txt
            SHA256SUMS-Windows.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  linux:
    name: Linux - DEB + portátil (PyInstaller)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bibliotecas Qt/X11 do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-shape0 \
            libxcb-keysyms1 libxcb-image0 libxcb-render-util0 \
            libxcb-icccm4 libx11-xcb1 libegl1 libopengl0 fonts-dejavu-core xvfb xauth
      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Testes (Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Compilar aplicativo Linux
        run: |
          # pynput consulta DISPLAY ao ser importado; Xvfb garante que o
          # PyInstaller descubra os submódulos Linux durante a análise.
          xvfb-run -a -s '-screen 0 1366x768x24' python -m PyInstaller \
            --noconfirm --clean --windowed --onedir \
            --name "AURORA AutoFill" --add-data "assets:assets" \
            --collect-submodules pynput main.py
      - name: Verificar recursos empacotados
        run: |
          printf '%s\n' "$GITHUB_SHA" > 'dist/AURORA AutoFill/SOURCE-COMMIT.txt'
          python packaging/verify_bundle.py --platform linux --report linux-bundle-report.json
      - name: Testar EXE Linux sem monitor físico
        run: python packaging/smoke_frozen.py --exe 'dist/AURORA AutoFill/AURORA AutoFill'
      - name: Testar interface Linux sob X11 virtual
        run: xvfb-run -a -s '-screen 0 1366x768x24' python packaging/smoke_frozen.py --exe 'dist/AURORA AutoFill/AURORA AutoFill' --qt-platform xcb
      - name: Criar instalador Linux DEB
        run: python packaging/linux/build_deb_frozen.py --out AURORA-AutoFill-v0.5.2-Linux-amd64.deb
      - name: Criar pacote Linux portátil
        run: tar -czf AURORA-AutoFill-v0.5.2-Linux-portable-amd64.tar.gz -C dist 'AURORA AutoFill'
      - name: Verificar conteudo do DEB e registrar checksums
        run: |
          stage="$RUNNER_TEMP/aurora-deb-check"
          dpkg-deb --info AURORA-AutoFill-v0.5.2-Linux-amd64.deb
          dpkg-deb --extract AURORA-AutoFill-v0.5.2-Linux-amd64.deb "$stage"
          python packaging/verify_bundle.py --platform linux --dist "$stage/opt/aurora-autofill"
          test -x "$stage/usr/bin/aurora-autofill"
          test -f "$stage/usr/share/applications/aurora-autofill.desktop"
          test -f "$stage/usr/share/icons/hicolor/256x256/apps/aurora-autofill.png"
          cp 'dist/AURORA AutoFill/SOURCE-COMMIT.txt' SOURCE-COMMIT.txt
          sha256sum AURORA-AutoFill-v0.5.2-Linux-amd64.deb AURORA-AutoFill-v0.5.2-Linux-portable-amd64.tar.gz > SHA256SUMS-Linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AURORA-AutoFill-Linux-${{ github.run_number }}
          path: |
            AURORA-AutoFill-v0.5.2-Linux-amd64.deb
            AURORA-AutoFill-v0.5.2-Linux-portable-amd64.tar.gz
            linux-bundle-report.json
            SOURCE-COMMIT.txt
            SHA256SUMS-Linux.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
