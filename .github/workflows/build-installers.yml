name: Compilar instaladores AURORA AutoFill

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    name: Instalador Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Compilar aplicativo
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name "AURORA AutoFill" --icon "assets/aurora_icon.ico" --add-data "assets;assets" --collect-submodules pynput main.py
      - name: Preparar Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
      - name: Criar instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "packaging/windows/AURORA-AutoFill.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: AURORA-AutoFill-v0.5.1-Windows-Setup
          path: installer-win/*.exe
          if-no-files-found: error

  linux:
    name: Instalador Linux DEB e portátil
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bibliotecas Linux Qt
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0
      - name: Dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Compilar aplicativo
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name "AURORA AutoFill" --add-data "assets:assets" --collect-submodules pynput main.py
      - name: Verificar aplicativo compilado
        env:
          QT_QPA_PLATFORM: offscreen
          AURORA_AUTOFILL_SMOKE_TEST: '1'
        run: "dist/AURORA AutoFill/AURORA AutoFill"
      - name: Criar DEB
        run: python packaging/linux/build_deb_frozen.py --out AURORA-AutoFill-v0.5.1-Linux-amd64.deb
      - name: Criar versão portátil
        run: tar -czf AURORA-AutoFill-v0.5.1-Linux-portable-amd64.tar.gz -C dist "AURORA AutoFill"
      - uses: actions/upload-artifact@v4
        with:
          name: AURORA-AutoFill-v0.5.1-Linux
          path: |
            AURORA-AutoFill-v0.5.1-Linux-amd64.deb
            AURORA-AutoFill-v0.5.1-Linux-portable-amd64.tar.gz
          if-no-files-found: error